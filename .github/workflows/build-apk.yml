
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Food_Intake_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
          unzip -o Food_Intake_Android_Project.zip -d project
          find project -maxdepth 3 -type f | head -100
          echo "Project extracted"

      - name: Build APK
        working-directory: project
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: food-intake-tracker-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
